[project]
name = "innovos-backend"
version = "0.1.0"
description = "InnovOS 创新智能操作系统后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "openai>=2.41.0",
    "psutil>=5.9.0",
    "numpy>=2.2.6",
    "python-multipart>=0.0.32",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "PyPDF2>=3.0.0",
    "pdfminer.six>=20221105",
    "python-docx>=1.1.0",
    "readability-lxml>=0.8.0",
    "html2text>=2024.0.0",
    "lxml>=5.0.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "alembic>=1.18.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Prevent Database.get_db() from trying to connect to PostgreSQL during tests
env = [
    "DATABASE_URL=postgresql://test:test@localhost:5432/test",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# 全局覆盖率不低于 25%（持续提升中；新增代码建议 ≥ 80%）
fail_under = 25
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise AssertionError",
    "if TYPE_CHECKING:",
]

[project.scripts]
dev = "uvicorn app.main:app --reload"
start = "uvicorn app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "black>=25.0.0",
    "isort>=6.0.0",
    "pre-commit>=4.0.0",
    "bandit>=1.8.0",
    "safety>=3.0.0",
]

# ── Cloud Deployment ──────────────────────────────────────
# For minimal production image, install only core deps:
#   pip install innovos-backend
# For OCR support, add: pip install innovos-backend[ocr]

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "PT"]
ignore = ["B008", "E501", "N802", "N803", "N806", "N815", "ARG", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402", "F401"]
"tests/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
# strict = true  # 暂不启用 - 代码库需大面积类型注解
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]

# ── Black ─────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py310"]

# ── isort ─────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 120
