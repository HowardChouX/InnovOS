<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnovOS 分析动画方案</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter','Noto Sans SC',sans-serif; background: #0b1120; color: #e2e8f0; padding: 40px; }
h2 { font-family: 'DM Sans','Noto Sans SC',sans-serif; font-size: 16px; color: #94a3b8; margin-bottom: 20px; letter-spacing: 0.04em; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 48px; }
.cell { background: #162032; border: 1px solid #1e3050; border-radius: 12px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; min-height: 320px; justify-content: center; }
.cell h3 { font-size: 13px; color: #64748b; margin-bottom: 8px; font-weight: 500; }
.cell .label { font-size: 18px; font-weight: 600; color: #e2e8f0; }
.cell .sub { font-size: 13px; color: #94a3b8; }

/* ═══════ 方案 A：波纹脉冲环 ═══════ */
.wave-ring { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
.wave-ring .core { width: 32px; height: 32px; border-radius: 50%; background: var(--accent,#3b82f6); }
.wave-ring .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent,#3b82f6); opacity: 0; animation: wave-expand 2s ease-out infinite; }
.wave-ring .ring:nth-child(2) { animation-delay: 0.6s; }
.wave-ring .ring:nth-child(3) { animation-delay: 1.2s; }
@keyframes wave-expand {
  0%   { transform: scale(0.3); opacity: 0.7; }
  100% { transform: scale(1);   opacity: 0; }
}

/* ═══════ 方案 B：点阵呼吸 ═══════ */
.dot-matrix { display: flex; gap: 8px; align-items: center; }
.dot-matrix .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent,#3b82f6); opacity: 0.15;
  animation: dot-breathe 1.6s ease-in-out infinite;
}
.dot-matrix .dot:nth-child(2) { animation-delay: 0.15s; }
.dot-matrix .dot:nth-child(3) { animation-delay: 0.3s; }
.dot-matrix .dot:nth-child(4) { animation-delay: 0.45s; }
.dot-matrix .dot:nth-child(5) { animation-delay: 0.6s; }
@keyframes dot-breathe {
  0%, 100% { opacity: 0.15; transform: scale(0.8); }
  50%      { opacity: 1;    transform: scale(1.3); }
}

/* ═══════ 方案 C：六边形网络脉冲 ═══════ */
.hex-anim { position: relative; width: 100px; height: 100px; }
.hex-anim svg { width: 100px; height: 100px; }

/* ═══════ 方案 D：环形进度条 + 粒子 ═══════ */
.spinner-ring { position: relative; width: 70px; height: 70px; }
.spinner-ring svg { animation: spinner-rotate 1.2s linear infinite; }
.spinner-ring .arc { stroke: #1e3050; stroke-width: 4; fill: none; }
.spinner-ring .accent-arc { stroke: var(--accent,#3b82f6); stroke-width: 4; fill: none; stroke-linecap: round;
  stroke-dasharray: 100 200; animation: arc-dash 1.5s ease-in-out infinite; }
@keyframes spinner-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes arc-dash {
  0%   { stroke-dasharray: 10 200; }
  50%  { stroke-dasharray: 120 200; }
  100% { stroke-dasharray: 10 200; }
}

/* ═══════ 共用强调色 ═══════ */
:root { --accent: #3b82f6; }
</style>
</head>
<body>

<h2>分析等待动画 — 选择方案</h2>

<div class="grid">

  <!-- 方案 A：波纹脉冲环 -->
  <div class="cell">
    <h3>方案 A — 波纹脉冲环</h3>
    <div class="wave-ring">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="core"></div>
    </div>
    <div class="label">需求洞察</div>
    <div class="sub">理解用户需求，提取关键要素</div>
  </div>

  <!-- 方案 B：点阵呼吸 -->
  <div class="cell">
    <h3>方案 B — 点阵呼吸</h3>
    <div class="dot-matrix">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="label">问题建模</div>
    <div class="sub">构建问题模型，识别核心冲突</div>
  </div>

  <!-- 方案 C：六边形网络脉冲 -->
  <div class="cell">
    <h3>方案 C — 六边形网络脉冲</h3>
    <div class="hex-anim">
      <svg viewBox="0 0 100 100">
        <line x1="33" y1="18" x2="67" y2="18" stroke="#1e3050" stroke-width="1"/>
        <line x1="67" y1="18" x2="83" y2="50" stroke="#1e3050" stroke-width="1"/>
        <line x1="83" y1="50" x2="67" y2="82" stroke="#1e3050" stroke-width="1"/>
        <line x1="67" y1="82" x2="33" y2="82" stroke="#1e3050" stroke-width="1"/>
        <line x1="33" y1="82" x2="17" y2="50" stroke="#1e3050" stroke-width="1"/>
        <line x1="17" y1="50" x2="33" y2="18" stroke="#1e3050" stroke-width="1"/>
        <!-- Animated nodes -->
        <circle cx="33" cy="18" r="4" fill="var(--accent)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="67" cy="18" r="4" fill="var(--accent)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="83" cy="50" r="4" fill="var(--accent)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="67" cy="82" r="4" fill="var(--accent)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="33" cy="82" r="4" fill="var(--accent)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="17" cy="50" r="4" fill="var(--accent)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="1.0s" repeatCount="indefinite"/></circle>
      </svg>
    </div>
    <div class="label">专利检索</div>
    <div class="sub">检索相关专利，分析技术方案</div>
  </div>

  <!-- 方案 D：环形进度条 -->
  <div class="cell">
    <h3>方案 D — 环形进度条</h3>
    <div class="spinner-ring">
      <svg viewBox="0 0 40 40" width="70" height="70">
        <circle class="arc" cx="20" cy="20" r="17"/>
        <circle class="accent-arc" cx="20" cy="20" r="17"/>
      </svg>
    </div>
    <div class="label">方案生成</div>
    <div class="sub">生成创新方案，整合多源知识</div>
  </div>

  <!-- 方案 E：雷达扫描 -->
  <div class="cell">
    <h3>方案 E — 雷达扫描</h3>
    <div class="radar-scan">
      <svg viewBox="0 0 80 80" width="80" height="80">
        <circle cx="40" cy="40" r="35" fill="none" stroke="#1e3050" stroke-width="1"/>
        <circle cx="40" cy="40" r="25" fill="none" stroke="#1e3050" stroke-width="1"/>
        <circle cx="40" cy="40" r="15" fill="none" stroke="#1e3050" stroke-width="1"/>
        <line x1="40" y1="40" x2="40" y2="5" stroke="var(--accent)" stroke-width="1.5" opacity="0.8">
          <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="2s" repeatCount="indefinite"/>
        </line>
        <circle cx="40" cy="40" r="3" fill="var(--accent)" opacity="0.6"/>
      </svg>
    </div>
    <div class="label">方案评估</div>
    <div class="sub">多维度评估方案可行性与创新性</div>
  </div>

  <!-- 方案 F：数据流聚合 -->
  <div class="cell">
    <h3>方案 F — 数据流聚合</h3>
    <div class="flow-aggregate">
      <svg viewBox="0 0 100 100" width="80" height="80">
        <!-- 三条流线向中心汇聚 -->
        <path d="M10 20 Q 40 20 50 50" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.3">
          <animate attributeName="stroke-dasharray" values="0 100;60 100;0 100" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M10 50 Q 40 50 50 50" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.5">
          <animate attributeName="stroke-dasharray" values="0 100;60 100;0 100" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        </path>
        <path d="M10 80 Q 40 80 50 50" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.3">
          <animate attributeName="stroke-dasharray" values="0 100;60 100;0 100" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        </path>
        <!-- 流线出散 -->
        <path d="M50 50 Q 60 30 90 20" fill="none" stroke="var(--accent-green,#4ade80)" stroke-width="1.5" opacity="0.3">
          <animate attributeName="stroke-dasharray" values="0 100;60 100;0 100" dur="2s" begin="1s" repeatCount="indefinite"/>
        </path>
        <path d="M50 50 Q 60 50 90 50" fill="none" stroke="var(--accent-green,#4ade80)" stroke-width="1.5" opacity="0.5">
          <animate attributeName="stroke-dasharray" values="0 100;60 100;0 100" dur="2s" begin="1.3s" repeatCount="indefinite"/>
        </path>
        <path d="M50 50 Q 60 70 90 80" fill="none" stroke="var(--accent-green,#4ade80)" stroke-width="1.5" opacity="0.3">
          <animate attributeName="stroke-dasharray" values="0 100;60 100;0 100" dur="2s" begin="1.6s" repeatCount="indefinite"/>
        </path>
        <!-- 中心节点 -->
        <circle cx="50" cy="50" r="5" fill="var(--accent)" opacity="0.8"/>
      </svg>
    </div>
    <div class="label">成果转化</div>
    <div class="sub">结构化输出创新成果，支持专利转化</div>
  </div>

</div>

<h2>全部步骤串联效果</h2>

<div style="display:flex; gap:32px; align-items:center; justify-content:center; padding:40px 0;">
  <!-- Step: completed -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <span style="font-size:11px;color:var(--accent);font-weight:500;">需求洞察</span>
  </div>
  <div style="width:40px;height:1px;background:var(--accent);"></div>
  <!-- Step: completed -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <span style="font-size:11px;color:var(--accent);font-weight:500;">问题建模</span>
  </div>
  <div style="width:40px;height:1px;background:var(--accent);"></div>
  <!-- Step: running (方案 B dots) -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(59,130,246,0.3);">
      <div style="display:flex;gap:3px;">
        <div class="dot" style="animation: dot-breathe 1.6s ease-in-out infinite;"></div>
        <div class="dot" style="animation: dot-breathe 1.6s ease-in-out infinite 0.15s;"></div>
        <div class="dot" style="animation: dot-breathe 1.6s ease-in-out infinite 0.3s;"></div>
      </div>
    </div>
    <span style="font-size:11px;color:var(--accent);font-weight:600;">专利检索</span>
    <span style="font-size:10px;color:#64748b;">检索中...</span>
  </div>
  <div style="width:40px;height:1px;background:#1e3050;"></div>
  <!-- Step: pending -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:50%;border:2px solid #1e3050;display:flex;align-items:center;justify-content:center;">
      <span style="font-size:13px;color:#64748b;">4</span>
    </div>
    <span style="font-size:11px;color:#64748b;">方案生成</span>
  </div>
  <div style="width:40px;height:1px;background:#1e3050;"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:50%;border:2px solid #1e3050;display:flex;align-items:center;justify-content:center;">
      <span style="font-size:13px;color:#64748b;">5</span>
    </div>
    <span style="font-size:11px;color:#64748b;">方案评估</span>
  </div>
  <div style="width:40px;height:1px;background:#1e3050;"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:50%;border:2px solid #1e3050;display:flex;align-items:center;justify-content:center;">
      <span style="font-size:13px;color:#64748b;">6</span>
    </div>
    <span style="font-size:11px;color:#64748b;">成果转化</span>
  </div>
</div>

</body>
</html>
