name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: innovos
          POSTGRES_PASSWORD: innovos_secret
          POSTGRES_DB: innovos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint backend
        run: uv run ruff check app/
        working-directory: backend

      - name: Type check backend
        run: uv run mypy app/
        working-directory: backend
        continue-on-error: true

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Type check frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test backend
        run: uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
        working-directory: backend
        env:
          DATABASE_URL: postgresql://innovos:innovos_secret@localhost:5432/innovos
          INNOVOS_JWT_SECRET: ci-test-secret-key
          ENVIRONMENT: test

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false
