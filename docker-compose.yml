# InnovOS Docker Compose
# 使用 bridge 网络，服务之间通过 Docker DNS（service name）通信。
# 容器间无需访问宿主机网络，端口通过 ports 映射暴露。

services:

  postgres:
    image: pgvector/pgvector:pg17
    networks:
      - innovos-net
    ports:
      - "5432:5432"
    env_file: ./.env
    environment:
      POSTGRES_DB: innovos
      POSTGRES_USER: innovos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U innovos']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    networks:
      - innovos-net
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  minio:
    image: minio/minio:latest
    networks:
      - innovos-net
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  minio-setup:
    image: minio/mc:latest
    networks:
      - innovos-net
    depends_on:
      minio:
        condition: service_healthy
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-innovos-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb myminio/$${S3_BUCKET:-innovos-files} --ignore-existing &&
      echo 'MinIO bucket created' &&
      exit 0
      "
    restart: 'no'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    networks:
      - innovos-net
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    env_file: ./.env
    volumes:
      - backend_uploads:/app/data/uploads
      - ./backend/alembic:/app/alembic
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://innovos:${POSTGRES_PASSWORD}@postgres:5432/innovos
      INNOVOS_JWT_SECRET: ${INNOVOS_JWT_SECRET}
      INNOVOS_ADMIN_USER: ${INNOVOS_ADMIN_USER}
      INNOVOS_ADMIN_PASSWORD: ${INNOVOS_ADMIN_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-innovos-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      REDIS_URL: redis://redis:6379/0
      INNOVOS_ENCRYPT_KEY: ${INNOVOS_ENCRYPT_KEY:?required}
      CNIPR_CLIENT_ID: ${CNIPR_CLIENT_ID}
      CNIPR_CLIENT_SECRET: ${CNIPR_CLIENT_SECRET}
      CNIPR_USERNAME: ${CNIPR_USERNAME:-}
      CNIPR_PASSWORD: ${CNIPR_PASSWORD:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
      ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    networks:
      - innovos-net
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

networks:
  innovos-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:
