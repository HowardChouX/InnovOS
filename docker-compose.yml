services:
  # ─── PostgreSQL + pgvector ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    env_file: ./.env
    environment:
      POSTGRES_DB: innovos
      POSTGRES_USER: innovos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U innovos']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Redis (rate limiting + caching) ─────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Mailpit (dev email capture, optional) ──────────────────
  # 默认不强制启动；如需使用：
  #   docker compose --profile mail up mailpit
  #   然后把 .env 中 SMTP_HOST=mailpit SMTP_PORT=1025
  mailpit:
    image: axllent/mailpit:latest
    profiles: ['mail']
    ports:
      - '8025:8025'   # Web UI
      - '1025:1025'   # SMTP
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── MinIO (S3-compatible object storage) ────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # ports:  # Security: MinIO only needs internal Docker network access.
    #   - "9000:9000"   # S3 API — production: remove for security
    #   - "9001:9001"   # Console UI — production: remove for security
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Create MinIO bucket on startup ──────────────────────────
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-innovos-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb myminio/$${S3_BUCKET:-innovos-files} --ignore-existing &&
      echo 'MinIO bucket created' &&
      exit 0
      "
    restart: 'no'

  # ─── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    env_file: ./.env
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      # Database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://innovos:${POSTGRES_PASSWORD}@postgres:5432/innovos
      # JWT
      INNOVOS_JWT_SECRET: ${INNOVOS_JWT_SECRET}
      # Admin
      INNOVOS_ADMIN_USER: ${INNOVOS_ADMIN_USER}
      INNOVOS_ADMIN_PASSWORD: ${INNOVOS_ADMIN_PASSWORD}
      # S3 / MinIO
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-innovos-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Public URL for file access
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # AI Provider Keys
      AI_SILICON_API_KEY: ${AI_SILICON_API_KEY}
      AI_SILICON_API_HOST: ${AI_SILICON_API_HOST:-https://api.siliconflow.cn}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY}
      AI_DEEPSEEK_API_HOST: ${AI_DEEPSEEK_API_HOST:-https://api.deepseek.com}
      # CNIPR Patent API
      CNIPR_CLIENT_ID: ${CNIPR_CLIENT_ID}
      CNIPR_CLIENT_SECRET: ${CNIPR_CLIENT_SECRET}
      CNIPR_USERNAME: ${CNIPR_USERNAME:-}
      CNIPR_PASSWORD: ${CNIPR_PASSWORD:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
      ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Frontend (SPA + nginx reverse proxy) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - '80:80'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  minio_data:
  backend_uploads:
