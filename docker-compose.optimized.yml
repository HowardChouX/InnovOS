# InnovOS 优化版 Docker Compose
# 基于最佳实践配置

version: '3.8'

# ═══════════════════════════════════════════════════════════
#  服务定义
# ═══════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL + pgvector ───────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: innovos-postgres
    env_file: ./.env
    environment:
      POSTGRES_DB: innovos
      POSTGRES_USER: innovos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U innovos']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - innovos-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Redis (rate limiting + caching) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: innovos-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    networks:
      - innovos-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── MinIO (S3-compatible object storage) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: innovos-minio
    command: server /data --console-address ":9001"
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - innovos-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Create MinIO bucket on startup ──────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: innovos-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-innovos-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb myminio/$${S3_BUCKET:-innovos-files} --ignore-existing &&
      echo 'MinIO bucket created' &&
      exit 0
      "
    restart: 'no'
    networks:
      - innovos-network

  # ─── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innovos-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    env_file: ./.env
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      # Database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://innovos:${POSTGRES_PASSWORD}@postgres:5432/innovos
      # JWT
      INNOVOS_JWT_SECRET: ${INNOVOS_JWT_SECRET}
      # Admin
      INNOVOS_ADMIN_USER: ${INNOVOS_ADMIN_USER}
      INNOVOS_ADMIN_PASSWORD: ${INNOVOS_ADMIN_PASSWORD}
      # S3 / MinIO
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-innovos-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Public URL for file access
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # AI Provider Keys
      AI_SILICON_API_KEY: ${AI_SILICON_API_KEY}
      AI_SILICON_API_HOST: ${AI_SILICON_API_HOST:-https://api.siliconflow.cn}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY}
      AI_DEEPSEEK_API_HOST: ${AI_DEEPSEEK_API_HOST:-https://api.deepseek.com}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
      ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - innovos-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Frontend (SPA + nginx reverse proxy) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: innovos-frontend
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    networks:
      - innovos-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

# ═══════════════════════════════════════════════════════════
#  网络配置
# ═══════════════════════════════════════════════════════════

networks:
  innovos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ═══════════════════════════════════════════════════════════
#  卷配置
# ═══════════════════════════════════════════════════════════

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_uploads:
    driver: local
